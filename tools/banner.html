<!doctype html>
<!-- Five phones on the family sky. tools/screenshots.sh renders this to screenshots/banner.png. -->
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; width: 2400px; height: 1260px; overflow: hidden; }
  body {
    background:
      radial-gradient(1100px 800px at 12% 4%, rgba(143,214,255,.30), transparent 70%),
      radial-gradient(900px 700px at 92% 30%, rgba(185,168,255,.26), transparent 70%),
      radial-gradient(1200px 700px at 42% 108%, rgba(255,159,180,.22), transparent 70%),
      linear-gradient(180deg, #070D26 0%, #14215A 60%, #2B3D7E 100%);
    display: flex; align-items: center; justify-content: center; gap: 56px;
  }
  .phone {
    width: 400px; height: 870px; border-radius: 58px; padding: 12px; background: #05060c;
    box-shadow: 0 50px 110px rgba(0,0,0,.55), 0 0 0 2px rgba(255,255,255,.10), inset 0 0 0 1px rgba(255,255,255,.06);
  }
  .phone img { width: 100%; height: 100%; border-radius: 46px; object-fit: cover; object-position: top; display: block; }
  .mid { transform: scale(1.1); box-shadow: 0 60px 140px rgba(143,124,255,.45), 0 0 0 2px rgba(255,255,255,.14); }
  .low { transform: translateY(46px); }
</style></head><body>
  <div class="phone low"><img src="../screenshots/listen.png"></div>
  <div class="phone"><img src="../screenshots/artist.png"></div>
  <div class="phone mid"><img src="../screenshots/player.png"></div>
  <div class="phone"><img src="../screenshots/lyrics.png"></div>
  <div class="phone low"><img src="../screenshots/mood.png"></div>
</body></html>
