name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write # lets the build publish each version as a release

env:
  # the family signing key, read by the app build file
  FAMILY_KEYSTORE_B64: ${{ secrets.FAMILY_KEYSTORE_B64 }}
  FAMILY_KEYSTORE_PASSWORD: ${{ secrets.FAMILY_KEYSTORE_PASSWORD }}
  FAMILY_KEY_PASSWORD: ${{ secrets.FAMILY_KEY_PASSWORD }}
  FAMILY_KEY_ALIAS: ${{ secrets.FAMILY_KEY_ALIAS }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Write local.properties (keys from repo secrets)
        run: |
          echo "SPOTIFY_CLIENT_ID=${{ secrets.SPOTIFY_CLIENT_ID }}" >> local.properties
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" >> local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      # One release per versionName in app/build.gradle.kts, like the rest of the family, with that version's
      # CHANGELOG.md section as its notes. Pushing again without a new version just replaces that release's APK.
      # Release files don't count against the Actions storage quota.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -m1 versionName app/build.gradle.kts | cut -d\" -f2)
          [ -n "$VERSION" ] || { echo "No versionName in app/build.gradle.kts"; exit 1; }
          APK="Fidelis_v${VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" "$APK" --clobber
          else
            CHANGES=$(awk -v v="$VERSION" '/^## /{ if (on) exit; if ($2 == v) { on = 1; next } } on' CHANGELOG.md)
            {
              echo "Download **${APK}** below and open it on your phone to install. Updating? Install it over the Fidelis you have: your sign-ins and mixes stay."
              echo
              echo "You need the Spotify app and Spotify Premium; the README has the setup."
              if [ -n "$CHANGES" ]; then echo; echo "**What's new in ${VERSION}**"; echo "$CHANGES"; fi
            } > notes.md
            gh release create "v${VERSION}" "$APK" --target "$GITHUB_SHA" --title "Fidelis v${VERSION}" --notes-file notes.md
          fi
